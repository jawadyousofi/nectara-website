<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head><body>
<script src="../assets/three.min.js"></script>
<script src="../app/kid3d.js"></script>
<script>
// Nectara's multicultural cast, in the same toon 3D style as Asal. The models live in app/kid3d.js (shared with the
// character builder). kids.html?kid=<id>&inside=1 renders one cast child; inside=1 gives the see-through tummy for "Inside Me".
// kids.html?traits=<json> renders any builder character. Rendered to assets/world/kids/ by tools/render_kids.cjs.
var Q = {}; location.search.slice(1).split('&').forEach(function (p) { var kv = p.split('='); Q[kv[0]] = decodeURIComponent(kv[1] || ''); });
var traits = Q.traits ? JSON.parse(Q.traits) : { cast: Q.kid || 'eli' };
window.RESULT = NectaraKid.render(traits, { inside: Q.inside === '1' });
</script></body></html>
