<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head><body>
<canvas id="c" width="1000" height="1500"></canvas>
<script src="../assets/three.min.js"></script>
<script>
// Renders the "Inside Me" child for Asal's World: same toon look as 3D Asal (app/asal3d.js), with see-through skin
// over the organs. Run tools/render_inside_kid.cjs to make assets/world/inside-kid.png and the organ positions.
var T = THREE;
var grad = new Uint8Array([90, 90, 90, 175, 175, 175, 255, 255, 255]);
var gradMap = new T.DataTexture(grad, 3, 1, T.RGBFormat); gradMap.minFilter = gradMap.magFilter = T.NearestFilter; gradMap.needsUpdate = true;
function toon(color, extra) { var o = { color: color, gradientMap: gradMap }; for (var k in extra || {}) o[k] = extra[k]; return new T.MeshToonMaterial(o); }
var INK = new T.MeshBasicMaterial({ color: 0x2a2118, side: T.BackSide });
function mesh(geo, mat, outline) { var m = new T.Mesh(geo, mat); if (outline) { var o = new T.Mesh(geo, INK); o.scale.setScalar(1 + outline); m.add(o); } return m; }
function tube(pts, r, mat, seg) { return mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts.map(function (p) { return new T.Vector3(p[0], p[1], p[2]); })), seg || 80, r, 12, false), mat); }

var SKIN = toon(0xe3ac80), HAIR = toon(0x2b1a12), SHORTS = toon(0x5b8def), SHOE = toon(0xe2725b), WHITE = toon(0xfffdf5);
var root = new T.Group(), anchors = {};
function anchor(name, x, y, z) { anchors[name] = new T.Vector3(x, y, z); }

// ---- organs (drawn first, inside the see-through torso) ----
var organs = new T.Group(); root.add(organs);
var PINK = toon(0xf2a7b4), LUNG = toon(0xf6c3cc), RED = toon(0xd9473a), LIVER = toon(0xb85c4c), STOM = toon(0xee9a9a), COLON = toon(0xd29a66), SMALL = toon(0xf4b9a2), VESSEL = toon(0xd9473a);
// lungs
[-1, 1].forEach(function (s) { var l = mesh(new T.SphereGeometry(0.3, 24, 18), LUNG, 0.02); l.scale.set(0.95, 1.45, 0.7); l.position.set(s * 0.32, 1.66, -0.05); organs.add(l); });
// food tube: from the throat, behind the heart, into the stomach
organs.add(tube([[0, 2.4, 0.02], [0, 2.12, 0.02], [0, 1.85, 0.0], [0.02, 1.55, 0.02], [0.08, 1.36, 0.08], [0.2, 1.3, 0.14]], 0.055, PINK));
anchor('tube', 0, 1.8, 0.1);
// heart, a little to the body's left
var heart = new T.Group(); heart.position.set(0.12, 1.55, 0.3); organs.add(heart);
[-1, 1].forEach(function (s) { var h = mesh(new T.SphereGeometry(0.105, 18, 14), RED, 0.04); h.position.set(s * 0.075, 0.04, 0); heart.add(h); });
var tip = mesh(new T.ConeGeometry(0.15, 0.2, 18), RED, 0.04); tip.rotation.z = Math.PI; tip.position.y = -0.1; heart.add(tip);
heart.rotation.z = -0.25; anchor('blood', 0.12, 1.55, 0.35);
// blood vessels out toward the arms and legs
[[[0.12, 1.55, 0.25], [-0.3, 1.8, 0.2], [-0.62, 1.66, 0.1]], [[0.12, 1.55, 0.25], [0.45, 1.8, 0.2], [0.62, 1.66, 0.1]],
 [[0.12, 1.5, 0.25], [-0.1, 1.0, 0.3], [-0.28, 0.4, 0.1]], [[0.12, 1.5, 0.25], [0.3, 1.0, 0.3], [0.28, 0.4, 0.1]]].forEach(function (p) { organs.add(tube(p, 0.018, VESSEL, 30)); });
// liver on the body's right (viewer's left)
var liver = mesh(new T.SphereGeometry(0.3, 24, 16), LIVER, 0.02); liver.scale.set(1.35, 0.6, 0.7); liver.position.set(-0.2, 1.28, 0.12); organs.add(liver);
// stomach: a J-shaped bag on the body's left (viewer's right)
var st = new T.Group(); st.position.set(0.3, 1.2, 0.2); organs.add(st);
var sb = mesh(new T.SphereGeometry(0.22, 24, 18), STOM, 0.03); sb.scale.set(1.0, 1.25, 0.75); sb.position.set(0.04, 0.03, 0); st.add(sb);
st.add(tube([[0.02, -0.18, 0], [-0.08, -0.26, 0.02], [-0.22, -0.22, 0.04], [-0.3, -0.12, 0.04]], 0.075, STOM, 30));
anchor('tummy', 0.32, 1.2, 0.35);
// large intestine framing the abdomen, with bumpy bands, ending at the bottom
var colonPts = [[-0.36, 0.6, 0.18], [-0.42, 0.78, 0.2], [-0.4, 0.98, 0.22], [-0.2, 1.04, 0.26], [0.05, 1.02, 0.28], [0.3, 1.0, 0.26], [0.42, 0.9, 0.22], [0.42, 0.7, 0.2], [0.3, 0.55, 0.22], [0.1, 0.5, 0.22], [0.02, 0.38, 0.18]];
var cc = new T.CatmullRomCurve3(colonPts.map(function (p) { return new T.Vector3(p[0], p[1], p[2]); }));
organs.add(mesh(new T.TubeGeometry(cc, 120, 0.085, 14, false), COLON, 0.03));
var BAND = toon(0xb98552);
for (var i = 1; i < 26; i++) { var u = i / 26, pt = cc.getPointAt(u), tg = cc.getTangentAt(u); var ring = new T.Mesh(new T.TorusGeometry(0.086, 0.012, 6, 18), BAND); ring.position.copy(pt); ring.lookAt(pt.clone().add(tg)); organs.add(ring); }
anchor('poop', 0.03, 0.42, 0.25);
// small intestine: the long twisty tube, coiled inside the frame
var coil = [], rows = 5;
for (var k = 0; k <= 400; k++) {
  var t = k / 400 * rows, row = Math.floor(Math.min(t, rows - 0.0001)), f = t - row, dir = row % 2 ? -1 : 1;
  var x = dir * (-0.25 + 0.5 * f) + Math.sin(f * Math.PI * 4 + row) * 0.03;
  var y = 0.92 - row * 0.07 - Math.sin(f * Math.PI) * 0.02 + Math.sin(f * Math.PI * 6 + row * 2) * 0.012;
  var edge = Math.pow(Math.abs(f - 0.5) * 2, 6); x = x * (1 - edge * 0.1); y -= edge * 0.035 * (f > 0.5 ? 1 : -1) * 0;
  coil.push([x, y, 0.27 + Math.sin(f * Math.PI * 3 + row) * 0.03]);
}
organs.add(tube(coil, 0.036, SMALL, 600));
anchor('twisty', 0, 0.78, 0.3);

// ---- the see-through body ----
var cavity = new T.Mesh(new T.SphereGeometry(0.84, 40, 30), new T.MeshBasicMaterial({ color: 0xfff1e4, side: T.BackSide }));
cavity.scale.set(1, 1.18, 0.62); cavity.position.y = 1.25; root.add(cavity);
var shell = new T.Mesh(new T.SphereGeometry(0.86, 40, 30), toon(0xe3ac80, { transparent: true, opacity: 0.32, depthWrite: false }));
shell.scale.set(1, 1.18, 0.64); shell.position.y = 1.25; shell.renderOrder = 5; root.add(shell);
var rim = new T.Mesh(new T.SphereGeometry(0.86, 40, 30), INK); rim.scale.set(1.035, 1.2, 0.66); rim.position.y = 1.25; root.add(rim);
// shorts
var shorts = mesh(new T.CylinderGeometry(0.66, 0.62, 0.26, 30), SHORTS, 0.03); shorts.position.y = 0.36; shorts.scale.z = 0.66; root.add(shorts);
[-1, 1].forEach(function (s) { var lg = mesh(new T.CylinderGeometry(0.29, 0.26, 0.34, 20), SHORTS, 0.03); lg.position.set(s * 0.3, 0.12, 0); root.add(lg); });
// neck and head (same face as Asal: dark oval eyes with a sparkle, rosy cheeks, small nose, smile)
var neck = mesh(new T.CylinderGeometry(0.2, 0.22, 0.3, 14), SKIN, 0.03); neck.position.y = 2.28; root.add(neck);
var head = new T.Group(); head.position.y = 3.06; head.scale.setScalar(0.82); root.add(head);
head.add(mesh(new T.SphereGeometry(1, 36, 28), SKIN, 0.03));
function onHead(x, y, lift) { var d = 1 + (lift || 0); return Math.sqrt(Math.max(0.0001, d * d - x * x - y * y)); }
var EYE = toon(0x2a1a12), SPARK = new T.MeshBasicMaterial({ color: 0xffffff });
[-0.36, 0.36].forEach(function (x) { var y = -0.16;
  var e = mesh(new T.SphereGeometry(0.2, 20, 16), EYE); e.scale.set(0.9, 1.1, 0.42); e.position.set(x, y, onHead(x, y) - 0.03); head.add(e);
  var h = new T.Mesh(new T.SphereGeometry(0.066, 10, 8), SPARK); h.scale.z = 0.4; h.position.set(x + 0.06, y + 0.08, onHead(x, y) + 0.04); head.add(h); });
[-0.6, 0.6].forEach(function (x) { var y = -0.5; var ch = new T.Mesh(new T.SphereGeometry(0.15, 14, 10), new T.MeshBasicMaterial({ color: 0xf0a08a, transparent: true, opacity: 0.6 })); ch.scale.set(1, 1, 0.25); ch.position.set(x, y, onHead(x, y) - 0.01); head.add(ch); });
var nose = mesh(new T.SphereGeometry(0.05, 10, 8), toon(0x9c6b4e)); nose.position.set(0, -0.38, onHead(0, -0.38) + 0.01); head.add(nose);
// an open, happy mouth (this is where the journey starts)
var mouth = mesh(new T.SphereGeometry(0.2, 20, 14, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), toon(0x7a2a2a)); mouth.scale.set(1, 0.9, 0.35); mouth.rotation.x = -0.25; mouth.position.set(0, -0.56, onHead(0, -0.56) - 0.06); head.add(mouth);
var tongue = mesh(new T.SphereGeometry(0.1, 14, 10), toon(0xf08a96)); tongue.scale.set(1.1, 0.5, 0.5); tongue.position.set(0, -0.68, onHead(0, -0.68) - 0.02); head.add(tongue);
var teeth = mesh(new T.BoxGeometry(0.2, 0.045, 0.03), WHITE); teeth.position.set(0, -0.585, onHead(0, -0.585) - 0.05); head.add(teeth);
anchor("mouth", 0, 3.06 - 0.6 * 0.82, 0.85);
// short curly hair: a cap of curls, plus a fringe of curls along the hairline
var hair = new T.Group(); head.add(hair);
for (var n = 0; n < 150; n++) {
  var y2 = 1 - (n + 0.5) / 150 * 2, r2 = Math.sqrt(1 - y2 * y2), th = n * 2.39996;
  var px = Math.cos(th) * r2, pz = Math.sin(th) * r2;
  if (y2 < 0.18 && pz > -0.2) continue;          // keep the face clear
  if (y2 < -0.55) continue;
  var c = mesh(new T.SphereGeometry(0.21, 12, 10), HAIR); c.position.set(px * 1.03, y2 * 1.03, pz * 1.03); hair.add(c);
}
[-0.62, -0.38, -0.12, 0.12, 0.38, 0.62].forEach(function (x, i) { var y = 0.42 + (i % 2) * 0.06; var c = mesh(new T.SphereGeometry(0.17, 12, 10), HAIR); c.position.set(x, y, onHead(x, y, 0.04)); hair.add(c); });
[-1, 1].forEach(function (s) { var ear = mesh(new T.SphereGeometry(0.17, 14, 10), SKIN, 0.05); ear.scale.set(0.6, 1, 0.6); ear.position.set(s * 0.99, -0.12, 0); head.add(ear); });
// arms, a little out from the body, hands open
[-1, 1].forEach(function (s) {
  var sh = new T.Group(); sh.position.set(s * 0.72, 1.82, 0); sh.rotation.z = s * 0.38; root.add(sh);
  sh.add(mesh(new T.SphereGeometry(0.2, 16, 12), SKIN));
  var up = mesh(new T.CylinderGeometry(0.17, 0.155, 0.6, 14), SKIN, 0.03); up.position.y = -0.3; sh.add(up);
  var el = new T.Group(); el.position.y = -0.6; el.rotation.z = -s * 0.2; sh.add(el);
  el.add(mesh(new T.SphereGeometry(0.155, 14, 12), SKIN));
  var fo = mesh(new T.CylinderGeometry(0.15, 0.14, 0.5, 14), SKIN, 0.03); fo.position.y = -0.25; el.add(fo);
  var hand = mesh(new T.SphereGeometry(0.18, 14, 12), SKIN, 0.05); hand.scale.set(1, 1.1, 0.7); hand.position.y = -0.58; el.add(hand);
});
// legs and shoes
[-1, 1].forEach(function (s) {
  var hip = new T.Group(); hip.position.set(s * 0.3, 0.2, 0); root.add(hip);
  var th = mesh(new T.CylinderGeometry(0.2, 0.18, 0.55, 14), SKIN, 0.03); th.position.y = -0.27; hip.add(th);
  var kn = new T.Group(); kn.position.y = -0.55; hip.add(kn); kn.add(mesh(new T.SphereGeometry(0.18, 14, 12), SKIN));
  var sn = mesh(new T.CylinderGeometry(0.18, 0.16, 0.5, 14), SKIN, 0.03); sn.position.y = -0.25; kn.add(sn);
  var shoe = mesh(new T.SphereGeometry(0.22, 14, 12), SHOE, 0.06); shoe.scale.set(1.15, 0.7, 1.6); shoe.position.set(0, -0.56, 0.1); kn.add(shoe);
});

// ---- render ----
var r = new T.WebGLRenderer({ canvas: document.getElementById('c'), alpha: true, antialias: true, preserveDrawingBuffer: true });
r.setClearColor(0x000000, 0);
var scene = new T.Scene(); scene.add(root);
scene.add(new T.HemisphereLight(0xffffff, 0xcfe3b8, 0.55));
var sun = new T.DirectionalLight(0xfff6e6, 0.6); sun.position.set(4, 6, 10); scene.add(sun);
var cam = new T.PerspectiveCamera(22, 1000 / 1500, 1, 100); cam.position.set(0, 1.6, 15.2); cam.lookAt(0, 1.6, 0);
root.rotation.y = -0.12;
r.render(scene, cam);
root.updateMatrixWorld(true);
var out = {};
Object.keys(anchors).forEach(function (k) { var v = anchors[k].clone().applyMatrix4(root.matrixWorld).project(cam); out[k] = [Math.round((v.x + 1) / 2 * 1000), Math.round((1 - v.y) / 2 * 1500)]; });
var top = new T.Vector3(0, 3.06 + 1.05 * 0.82, 0).applyMatrix4(root.matrixWorld).project(cam); out.top = [500, Math.round((1 - top.y) / 2 * 1500)];
window.RESULT = { png: document.getElementById('c').toDataURL('image/png'), anchors: out };
</script></body></html>
