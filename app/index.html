  window.NX_REMOTE_PAGE = function (on) {
    var q = function (s) { return document.querySelector(s); };
    q('link[rel=manifest]').href = on ? '/assets/remote.webmanifest' : '/assets/app.webmanifest';
    q('link[rel=apple-touch-icon]').href = on ? '/assets/remote-icon-180.png' : '/assets/app-icon-180.png';
    q('meta[name=apple-mobile-web-app-title]').content = on ? 'Nectara Remote' : 'Nectara';
    q('meta[name=theme-color]').content = on ? '#2F4A35' : '#F7E7B4';
  };
  if (r) { if (!location.hash) location.replace('#/remote'); window.NX_REMOTE_PAGE(true); }
})();
</script>
